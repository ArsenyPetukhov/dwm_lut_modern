name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 5.0.0
      package_type:
        description: Package to compile
        type: choice
        options: [release, dither-preview]
        default: release
      preview_suffix:
        description: Preview tag suffix
        required: false
        default: dithering-preview

jobs:
  package:
    if: inputs.package_type != 'dither-preview'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "GitHub runner vcpkg was not found at $vcpkg"
          }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integration failed with exit code $LASTEXITCODE" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: NuGet/setup-nuget@v2
      - shell: pwsh
        run: |
          .\scripts\build-release.ps1
          .\scripts\test-build.ps1 -SkipBuild
          .\scripts\package-modern-installer.ps1 -Version "${{ github.event.inputs.version }}" -SkipBuild
          .\scripts\package-release.ps1 -Version "${{ github.event.inputs.version }}" -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: dwm-lut-modern-release
          path: dist/**

  dither-preview:
    if: inputs.package_type == 'dither-preview'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Integrate native dependency
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integration failed" }
      - name: Compile shaders, native library and portable app
        shell: pwsh
        run: .\scripts\build-dither-preview.ps1 -Version "${{ inputs.version }}" -PreviewSuffix "${{ inputs.preview_suffix }}"
      - name: Verify keyboard shortcut transactions
        shell: pwsh
        run: |
          dotnet test tests/DwmLutModern.App.Tests/DwmLutModern.App.Tests.csproj -c Release -p:Platform=x64 --filter "FullyQualifiedName~Hotkey|FullyQualifiedName~AppStateStore" --logger "trx;LogFileName=shortcuts.trx"
          if ($LASTEXITCODE -ne 0) { throw "Shortcut checks failed" }
      - name: Render application and verify live controls
        shell: powershell
        run: .\scripts\capture-neutral-ui.ps1 -Version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdr-dithering-preview
          path: |
            dist/sdr-dither-preview/**
            artifacts/ui-captures/**
            artifacts/ui-state-neutral/**/*.log
            tests/DwmLutModern.App.Tests/TestResults/**
