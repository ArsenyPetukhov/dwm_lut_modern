name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 5.0.0

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v3
        with:
          # Keep release packaging on the v143/vcpkg-enabled VS 2022 toolchain.
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: NuGet/setup-nuget@v2
      - shell: pwsh
        run: |
          .\scripts\build-release.ps1
          .\scripts\test-build.ps1 -SkipBuild
          .\scripts\package-modern-installer.ps1 -Version "${{ github.event.inputs.version }}" -SkipBuild
          .\scripts\package-release.ps1 -Version "${{ github.event.inputs.version }}" -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: dwm-lut-modern-release
          path: dist/**
