name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 5.0.0

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "GitHub runner vcpkg was not found at $vcpkg"
          }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integration failed with exit code $LASTEXITCODE" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: NuGet/setup-nuget@v2
      - shell: pwsh
        run: |
          .\scripts\build-release.ps1
          .\scripts\test-build.ps1 -SkipBuild
          .\scripts\package-modern-installer.ps1 -Version "${{ github.event.inputs.version }}" -SkipBuild
          .\scripts\package-release.ps1 -Version "${{ github.event.inputs.version }}" -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: dwm-lut-modern-release
          path: dist/**
