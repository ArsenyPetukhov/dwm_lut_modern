name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "GitHub runner vcpkg was not found at $vcpkg"
          }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integration failed with exit code $LASTEXITCODE" }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore dependencies
        shell: pwsh
        run: |
          nuget restore src/DwmLutGUI/DwmLutGUI.sln -PackagesDirectory src/DwmLutGUI/packages
          dotnet restore src/DwmLutModern.App/DwmLutModern.App.csproj -p:Platform=x64
          dotnet restore tests/DwmLutModern.App.Tests/DwmLutModern.App.Tests.csproj -p:Platform=x64

      - name: Build
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Test build artifacts
        shell: pwsh
        run: .\scripts\test-build.ps1 -SkipBuild

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwm-lut-modern-windows-x64
          path: |
            src/DwmLutGUI/DwmLutGUI/bin/Release/**
            src/DwmLutModern.App/bin/x64/Release/**
            x64/Release/**
